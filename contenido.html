<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Modificar Contenido HTML</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 50px; }
        nav a { margin: 0 10px; text-decoration: none; color: blue; }
    </style>
</head>
<body>

    <nav>
        <a href="index.html">Volver a Home</a>
    </nav>

    <h2>¿Qué puede hacer JavaScript?</h2>
    <p id="demo">JavaScript puede cambiar el contenido HTML.</p>
    
    <button type="button" onclick="document.getElementById('demo').innerHTML = '¡Hola JavaScript!'">
        Haz clic aquí
    </button>

</body>
</html>
