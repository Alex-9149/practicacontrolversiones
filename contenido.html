<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Modificar Contenido HTML</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 50px; }
        nav a { margin: 0 10px; text-decoration: none; color: blue; }
        .btn-mejorado {
            background-color: #4CAF50; /* Verde */
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .btn-mejorado:hover { background-color: #45a049; }
    </style>
</head>
<body>

    <nav>
        <a href="index.html">Volver a Home</a>
    </nav>

    <h2>¿Qué puede hacer JavaScript? (Versión Mejorada)</h2>
    <p id="demo">JavaScript puede cambiar el contenido HTML de forma dinámica.</p>
    
    <button class="btn-mejorado" type="button" onclick="document.getElementById('demo').innerHTML = '¡Hola JavaScript! Esta sección ha sido mejorada.'">
        Haz clic aquí para ver la magia
    </button>

</body>
</html>
